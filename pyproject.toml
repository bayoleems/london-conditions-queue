[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conditions-queue"
version = "0.1.0"
description = "How long London councils take to sign off planning conditions, and what predicts delay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "geopandas>=0.14",
    "shapely>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
notebooks = ["nbformat>=5.9", "nbconvert>=7.0", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conditions_queue = ["templates/*.html"]
